<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính TDEE - Tự Tin Ngoại Hình</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="tdee.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Tự Tin Ngoại Hình</div>
    <div>
      <ul class="nav-links">
        <li><a href="../../index.html">Trang Chủ</a></li>
        <li><a href="tdee.html">Mục Tiêu Cân Nặng</a></li>
        <li><a href="../bodyshape/shape.html">Vóc Dáng</a></li>
        <li><a href="../skintone/tone.html">Tông Da & Màu Sắc</a></li>
      </ul>
      <button id="dark-mode-toggle">🌙 Chế độ tối</button>
    </div>
  </nav>

  <main>
    <section class="tdee-calculator">
      <h1>Tính TDEE của bạn</h1>
      <form id="tdee-form">
        <label for="goal">Mục tiêu của bạn:</label>
        <select id="goal" required>
          <option value="" disabled selected>Chọn mục tiêu</option>
          <option value="maintain">Duy trì cân nặng</option>
          <option value="lose">Giảm cân</option>
          <option value="gain">Tăng cân</option>
        </select>

        <label for="age">Tuổi:</label>
        <input type="number" id="age" required min="1" max="120" placeholder="Nhập tuổi">

        <label for="gender">Giới tính:</label>
        <select id="gender" required>
          <option value="" disabled selected>Chọn giới tính</option>
          <option value="male">Nam</option>
          <option value="female">Nữ</option>
        </select>

        <label for="height">Chiều cao (cm):</label>
        <input type="number" id="height" required min="50" max="250" placeholder="Nhập chiều cao">

        <label for="weight">Cân nặng (kg):</label>
        <input type="number" id="weight" required min="20" max="300" placeholder="Nhập cân nặng">

        <label for="activity">Mức vận động:</label>
        <select id="activity" required>
          <option value="" disabled selected>Chọn mức vận động</option>
          <option value="1.2">Ít vận động (ngồi nhiều)</option>
          <option value="1.375">Nhẹ (tập 1-3 ngày/tuần)</option>
          <option value="1.55">Trung bình (tập 3-5 ngày/tuần)</option>
          <option value="1.725">Nặng (tập 6-7 ngày/tuần)</option>
          <option value="1.9">Rất nặng (vận động viên)</option>
        </select>

        <button type="submit">Tính TDEE</button>
      </form>

      <div id="error" class="error-message" style="display: none;"></div>

      <div id="result" style="display: none;">
        <h2>Kết quả TDEE</h2>
        <div class="result-details">
          <p id="bmr-value"></p>
          <p id="tdee-value"></p>
          <p id="calorie-suggestion"></p>
          <p id="explanation"></p>
          <h3>Gợi ý kế hoạch</h3>
          <div id="suggestions"></div>
        </div>
        <canvas id="tdee-chart" width="400" height="300"></canvas>
      </div>
    </section>
  </main>



  <script src="tdee.js"></script>
</body>
</html>
