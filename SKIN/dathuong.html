<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Sản phẩm Da Thường</title>
  <link rel="stylesheet" href="dathuong.css">

<body class="bg-pink-50">
  <!-- Tiêu đề lên đầu trang -->
  <div class="w-full bg-pink-100 py-4">
    <h1 class="text-3xl font-bold text-pink-700 mb-0 text-center">Sản phẩm dành cho da thường</h1>

  <!-- Navbar -->
  <nav class="bg-white shadow py-4 px-6 flex items-center justify-between">

    <div id="product-list" class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-4 text-center">
    <p>&copy; 2025 Thương hiệu. All rights reserved.</p>
    <div class="flex justify-center gap-4 mt-2">
