<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân tích da - SKIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hidden {
            display: none;
        }
        .galaxy-shadow {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }
        .gradient-spinner {
            background: linear-gradient(45deg, #6b7280, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-200 bg-opacity-90 backdrop-blur-sm py-6 galaxy-shadow">
        <div class="container mx-auto px-4 flex items-center justify-center space-x-4">
            <svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <div class="text-center">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800">Phân tích tình trạng da</h1>
                <p class="mt-1 text-sm sm:text-base text-gray-600">Tải ảnh khuôn mặt để nhận phân tích chuyên sâu và gợi ý chăm sóc</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto py-8 px-4 sm:px-6">
        <!-- Toast Notification -->
        <div id="toast" class="fixed top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-md shadow-lg hidden toast">
            <span id="toastMessage"></span>
        </div>

        <!-- Upload Form -->
        <section class="bg-white rounded-xl p-6 sm:p-8 mb-8 galaxy-shadow border border-gray-200">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh trái</label>
                        <input type="file" name="left" accept="image/jpeg,image/png" class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-gray-400 focus:border-gray-400 transition duration-200">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh phải</label>
                        <input type="file" name="right" accept="image/jpeg,image/png" class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-gray-400 focus:border-gray-400 transition duration-200">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh chính diện</label>
                        <input type="file" name="front" accept="image/jpeg,image/png" class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-gray-400 focus:border-gray-400 transition duration-200">
                    </div>
                </div>
                <div class="mt-6 flex justify-center space-x-4">
                    <button type="submit" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 active:bg-gray-700 transition duration-200 font-medium">Phân tích</button>
                    <button type="button" id="cleanupButton" class="bg-gray-400 text-white px-6 py-2 rounded-lg hover:bg-gray-500 active:bg-gray-600 transition duration-200 font-medium">Dọn dẹp file</button>
                </div>
            </form>
            <div id="loading" class="hidden mt-6 text-center">
                <svg class="animate-spin h-8 w-8 gradient-spinner mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-gray-600 text-sm">Đang phân tích...</p>
            </div>
        </section>

        <!-- Results -->
        <section id="results" class="hidden">
            <!-- Skin Score -->
            <div class="bg-white rounded-xl p-6 sm:p-8 mb-8 text-center galaxy-shadow border border-gray-200 fade-in">
                <h2 class="text-2xl font-semibold text-gray-800">Điểm da</h2>
                <p id="skinScore" class="text-4xl sm:text-5xl font-bold text-gray-600 mt-2">0/10</p>
            </div>

            <!-- Analysis -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 mb-8">
                <!-- Left -->
                <div class="bg-white rounded-xl p-6 galaxy-shadow border border-gray-200 fade-in">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Ảnh trái</h3>
                    <img id="leftImage" src="" alt="Ảnh trái" class="w-full h-64 object-cover rounded-lg mb-4 hover:scale-105 transition-transform duration-300">
                    <ul id="leftAnalysis" class="list-disc pl-5 text-gray-600 text-sm"></ul>
                </div>
                <!-- Right -->
                <div class="bg-white rounded-xl p-6 galaxy-shadow border border-gray-200 fade-in">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Ảnh phải</h3>
                    <img id="rightImage" src="" alt="Ảnh phải" class="w-full h-64 object-cover rounded-lg mb-4 hover:scale-105 transition-transform duration-300">
                    <ul id="rightAnalysis" class="list-disc pl-5 text-gray-600 text-sm"></ul>
                </div>
                <!-- Front -->
                <div class="bg-white rounded-xl p-6 galaxy-shadow border border-gray-200 fade-in">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Ảnh chính diện</h3>
                    <img id="frontImage" src="" alt="Ảnh chính diện" class="w-full h-64 object-cover rounded-lg mb-4 hover:scale-105 transition-transform duration-300">
                    <ul id="frontAnalysis" class="list-disc pl-5 text-gray-600 text-sm"></ul>
                </div>
            </div>

            <!-- Improvements -->
            <div class="bg-white rounded-xl p-6 sm:p-8 mb-8 galaxy-shadow border border-gray-200 fade-in">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Phương pháp cải thiện</h2>
                <div id="improvements" class="text-gray-600 text-sm"></div>
            </div>

            <!-- Products -->
            <div class="bg-white rounded-xl p-6 sm:p-8 galaxy-shadow border border-gray-200 fade-in">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Sản phẩm gợi ý</h2>
                <div class="mb-4">
                    <a href="/hotro" target="_blank" class="inline-block bg-teal-500 text-white px-4 py-2 rounded hover:bg-teal-600 transition">
                        ❓ Xác định loại da của bạn tại đây để chọn sản phẩm phù hợp
                    </a>
                </div>
                <div id="products" class="text-gray-600 text-sm"></div>
            </div>
        </section>
    </main>

    <script>
        // Toast notification function
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.className = `fixed top-4 right-4 px-4 py-2 rounded-md shadow-lg toast ${type === 'error' ? 'bg-red-500' : 'bg-green-500'} text-white`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Handle form submission
        document.getElementById("uploadForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            // Validate inputs
            const inputs = ['left', 'right', 'front'].map(name => document.querySelector(`input[name="${name}"]`));
            if (inputs.some(input => !input.files.length)) {
                showToast('Vui lòng tải lên cả ba ảnh (trái, phải, chính diện).');
                return;
            }

            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("results").classList.add("hidden");

            const formData = new FormData(this);
            try {
                const response = await fetch("http://127.0.0.1:5000/predict", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                console.log("Response JSON:", result);

                if (response.ok) {
                    document.getElementById("loading").classList.add("hidden");
                    document.getElementById("results").classList.remove("hidden");

                    // Display score
                    document.getElementById("skinScore").textContent = `${result.score}/10`;

                    // Display analysis
                    ["left", "right", "front"].forEach(side => {
                        const analysisList = document.getElementById(`${side}Analysis`);
                        const imgElement = document.getElementById(`${side}Image`);
                        analysisList.innerHTML = "";
                        imgElement.src = result.image_urls[side] + "?t=" + new Date().getTime();

                        if (result.analysis[side][0].label === "Không phát hiện") {
                            const li = document.createElement("li");
                            li.textContent = "Không phát hiện vấn đề da nào.";
                            analysisList.appendChild(li);
                        } else {
                            result.analysis[side].forEach(item => {
                                const li = document.createElement("li");
                                li.textContent = `${item.label}: ${(item.confidence * 100).toFixed(1)}%`;
                                analysisList.appendChild(li);
                            });
                        }
                    });

                    // Display improvements
                    const improvementsDiv = document.getElementById("improvements");
                    improvementsDiv.innerHTML = "";
                    ["acne", "pores", "pigment"].forEach(issue => {
                        if (result.improvements[issue].length > 0) {
                            const h4 = document.createElement("h4");
                            h4.className = "text-lg font-medium text-gray-700 mt-4";
                            h4.textContent = issue.charAt(0).toUpperCase() + issue.slice(1);
                            improvementsDiv.appendChild(h4);
                            const ul = document.createElement("ul");
                            ul.className = "list-disc pl-5";
                            result.improvements[issue].forEach(item => {
                                const li = document.createElement("li");
                                li.textContent = item;
                                ul.appendChild(li);
                            });
                            improvementsDiv.appendChild(ul);
                        }
                    });

                    // Display products
                    const productsDiv = document.getElementById("products");
                    productsDiv.innerHTML = "";
                    ["acne", "pores", "pigment"].forEach(issue => {
                        if (result.products[issue].length > 0) {
                            const h4 = document.createElement("h4");
                            h4.className = "text-lg font-medium text-gray-700 mt-4";
                            h4.textContent = issue.charAt(0).toUpperCase() + issue.slice(1);
                            productsDiv.appendChild(h4);
                            const ul = document.createElement("ul");
                            ul.className = "list-disc pl-5";
                            result.products[issue].forEach(item => {
                                const li = document.createElement("li");
                                li.textContent = item;
                                ul.appendChild(li);
                            });
                            productsDiv.appendChild(ul);
                        }
                    });
                } else {
                    document.getElementById("loading").classList.add("hidden");
                    showToast(`Lỗi từ server: ${result.error} (Mã: ${response.status})`);
                }
            } catch (error) {
                document.getElementById("loading").classList.add("hidden");
                showToast(`Lỗi kết nối: ${error.message}. Vui lòng kiểm tra server đang chạy trên http://127.0.0.1:5000`);
            }
        });

        // Handle cleanup
        document.getElementById("cleanupButton").addEventListener("click", async function () {
            try {
                const response = await fetch("http://127.0.0.1:5000/cleanup", {
                    method: "POST"
                });
                const result = await response.json();
                if (response.ok) {
                    showToast(result.message, 'success');
                } else {
                    showToast(`Lỗi từ server: ${result.error} (Mã: ${response.status})`);
                }
            } catch (error) {
                showToast(`Lỗi kết nối: ${error.message}. Vui lòng kiểm tra server đang chạy trên http://127.0.0.1:5000`);
            }
        });
    </script>
</body>
</html>
