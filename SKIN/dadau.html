<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm chăm sóc da dầu</title>
  <link rel="stylesheet" href="dathuong.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-6 max-w-4xl">
    <!-- Header -->
    <h1 class="text-3xl font-bold text-teal-600 mb-6 text-center">🧴 Sản phẩm chăm sóc da dầu</h1>
    <p class="text-gray-600 mb-6 text-center">Khám phá các sản phẩm phù hợp với da dầu, giúp kiểm soát dầu thừa, giảm mụn và bảo vệ da hiệu quả.</p>

    <!-- Bộ lọc giá -->
    <div class="mb-6">
      <label for="priceFilter" class="block text-lg font-semibold mb-2">Lọc theo giá:</label>
      <select id="priceFilter" class="border p-2 rounded w-full max-w-xs">
        <option value="all">Tất cả</option>
        <option value="low">Dưới 300.000 VNĐ</option>
        <option value="medium">300.000 - 600.000 VNĐ</option>
        <option value="high">Trên 600.000 VNĐ</option>
      </select>
    </div>

    <!-- Danh sách sản phẩm -->
    <div id="products" class="space-y-8">
      <!-- Sữa rửa mặt -->
      <div>
        <h2 class="text-2xl font-semibold text-teal-700 mb-4">Sữa rửa mặt</h2>
        <div id="cleansers" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
      <!-- Tẩy trang -->
      <div>
        <h2 class="text-2xl font-semibold text-teal-700 mb-4">Tẩy trang</h2>
        <div id="makeupRemovers" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
      <!-- Kem chống nắng -->
      <div>
        <h2 class="text-2xl font-semibold text-teal-700 mb-4">Kem chống nắng</h2>
        <div id="sunscreens" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
      <!-- Serum -->
      <div>
        <h2 class="text-2xl font-semibold text-teal-700 mb-4">Serum</h2>
        <div id="serums" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </div>

  <script>
    // Danh sách sản phẩm cho da dầu
    const products = {
      cleansers: [
        {
          name: "CeraVe Foaming Facial Cleanser",
          description: "Sữa rửa mặt tạo bọt với ceramides và niacinamide, làm sạch sâu, kiểm soát dầu thừa mà không làm khô da.",
          price: 350000,
          type: "cleanser"
        },
        {
          name: "La Roche-Posay Effaclar Gel",
          description: "Sữa rửa mặt dành cho da dầu, chứa nước khoáng giúp làm dịu da và giảm mụn hiệu quả.",
          price: 450000,
          type: "cleanser"
        },
        {
          name: "Neutrogena Oil-Free Acne Wash",
          description: "Sữa rửa mặt chứa salicylic acid, giúp làm sạch lỗ chân lông và ngăn ngừa mụn.",
          price: 250000,
          type: "cleanser"
        }
      ],
      makeupRemovers: [
        {
          name: "Garnier Micellar Water",
          description: "Nước tẩy trang micellar làm sạch nhẹ nhàng, loại bỏ dầu thừa và lớp trang điểm mà không gây kích ứng.",
          price: 200000,
          type: "makeup_remover"
        },
        {
          name: "Bioderma Sensibio H2O",
          description: "Nước tẩy trang dành cho da dầu và nhạy cảm, làm sạch sâu và dịu nhẹ với công nghệ micellar.",
          price: 400000,
          type: "makeup_remover"
        },
        {
          name: "Simple Kind To Skin Micellar Water",
          description: "Tẩy trang không chứa hương liệu, phù hợp cho da dầu, giúp làm sạch và cấp ẩm nhẹ.",
          price: 280000,
          type: "makeup_remover"
        }
      ],
      sunscreens: [
        {
          name: "EltaMD UV Clear SPF 46",
          description: "Kem chống nắng không dầu, chứa zinc oxide và niacinamide, bảo vệ da và giảm bóng dầu.",
          price: 600000,
          type: "sunscreen"
        },
        {
          name: "La Roche-Posay Anthelios Shaka Fluid SPF 50",
          description: "Kem chống nắng dạng lỏng, không gây bết dính, lý tưởng cho da dầu và dễ bị mụn.",
          price: 550000,
          type: "sunscreen"
        },
        {
          name: "CeraVe AM Facial Moisturizing Lotion SPF 30",
          description: "Kem chống nắng kiêm dưỡng ẩm, không gây bít tắc lỗ chân lông, phù hợp cho da dầu.",
          price: 400000,
          type: "sunscreen"
        }
      ],
      serums: [
        {
          name: "The Ordinary Niacinamide 10% + Zinc 1%",
          description: "Serum kiểm soát dầu và giảm mụn, giúp thu nhỏ lỗ chân lông và làm đều màu da.",
          price: 250000,
          type: "serum"
        },
        {
          name: "Paula's Choice 2% BHA Liquid Exfoliant",
          description: "Serum tẩy tế bào chết chứa salicylic acid, làm sạch lỗ chân lông và giảm mụn đầu đen.",
          price: 700000,
          type: "serum"
        },
        {
          name: "Some By Mi AHA-BHA-PHA 30 Days Miracle Serum",
          description: "Serum đa năng với AHA, BHA, PHA, giúp làm sạch da, giảm mụn và cải thiện kết cấu da.",
          price: 450000,
          type: "serum"
        }
      ]
    };

    // Hàm lấy tham số từ URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Hàm hiển thị sản phẩm
    function renderProducts(priceFilter) {
      const categories = ['cleansers', 'makeupRemovers', 'sunscreens', 'serums'];
      categories.forEach(category => {
        const container = document.getElementById(category);
        container.innerHTML = ''; // Xóa nội dung cũ
        let filteredProducts = products[category];

        // Lọc theo giá
        if (priceFilter === 'low') {
          filteredProducts = filteredProducts.filter(p => p.price < 300000);
        } else if (priceFilter === 'medium') {
          filteredProducts = filteredProducts.filter(p => p.price >= 300000 && p.price <= 600000);
        } else if (priceFilter === 'high') {
          filteredProducts = filteredProducts.filter(p => p.price > 600000);
        }

        // Hiển thị sản phẩm
        filteredProducts.forEach(product => {
          const productCard = document.createElement('div');
          productCard.className = 'border p-4 rounded-lg bg-white shadow-sm';
          productCard.innerHTML = `
            <h3 class="font-semibold text-lg">${product.name}</h3>
            <p class="text-gray-600">${product.description}</p>
            <p class="text-teal-600 font-medium">Giá: ${product.price.toLocaleString('vi-VN')} VNĐ</p>
          `;
          container.appendChild(productCard);
        });
      });
    }

    // Kiểm tra loại da từ URL
    const skinType = getQueryParam('type');
    if (skinType !== 'oily') {
      alert('Trang này chỉ hiển thị sản phẩm cho da dầu.');
      // Có thể chuyển hướng hoặc hiển thị thông báo khác
    }

    // Hiển thị sản phẩm ban đầu
    renderProducts('all');

    // Xử lý bộ lọc giá
    document.getElementById('priceFilter').addEventListener('change', function() {
      renderProducts(this.value);
    });
  </script>
</body>
</html>
