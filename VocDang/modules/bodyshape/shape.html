<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân Tích Vóc Dáng - Tự Tin Ngoại Hình</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="shape.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Tự Tin Ngoại Hình</div>
    <div>
      <ul class="nav-links">
        <li><a href="../../index.html">Trang Chủ</a></li>
        <li><a href="../weight/tdee.html">Mục Tiêu Cân Nặng</a></li>
        <li><a href="shape.html">Vóc Dáng</a></li>
        <li><a href="../skintone/tone.html">Tông Da & Màu Sắc</a></li>
      </ul>
      <button id="dark-mode-toggle">🌙 Chế độ tối</button>
    </div>
  </nav>

  <main>
    <section class="shape-analyzer">
      <h1>Phân Tích Vóc Dáng Của Bạn</h1>
      <p>Nhập số đo cơ thể của bạn (cm) để xác định vóc dáng:</p>
      <form id="shape-form">
        <label for="shoulder">Số đo vai:</label>
        <input type="number" id="shoulder" required min="20" max="100" placeholder="Nhập số đo vai (cm)">

        <label for="chest">Số đo ngực:</label>
        <input type="number" id="chest" required min="50" max="150" placeholder="Nhập số đo ngực (cm)">

        <label for="waist">Số đo eo:</label>
        <input type="number" id="waist" required min="40" max="120" placeholder="Nhập số đo eo (cm)">

        <label for="hip">Số đo hông:</label>
        <input type="number" id="hip" required min="50" max="150" placeholder="Nhập số đo hông (cm)">

        <label for="height">Chiều cao:</label>
        <input type="number" id="height" required min="100" max="250" placeholder="Nhập chiều cao (cm)">

        <button type="submit">Xác Định Vóc Dáng</button>
      </form>

      <div id="error" class="error-message" style="display: none;"></div>

      <div id="result" style="display: none;">
        <h2>Kết Quả Phân Tích Vóc Dáng</h2>
        <div class="result-details">
          <h3 id="shape-title"></h3>
          <p id="shape-description"></p>
          <h4>Nên mặc:</h4>
          <ul id="shape-recommendations"></ul>
          <h4>Nên tránh:</h4>
          <ul id="shape-avoid"></ul>
        </div>
      </div>
    </section>
  </main>

  

  <script src="shape.js"></script>
</body>
</html>
