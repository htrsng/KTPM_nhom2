<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Theo Dõi Calo</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-r from-blue-100 to-green-100 dark:from-gray-800 dark:to-gray-900 min-h-screen flex items-center justify-center transition-colors duration-300">
  <div class="container mx-auto p-6 max-w-4xl">
    <!-- Dark mode toggle -->
    <div class="flex justify-end mb-4">
      <button id="themeToggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white p-2 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
        <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </button>
    </div>

    <h1 class="text-4xl font-extrabold text-center text-gray-800 dark:text-white mb-8">Theo Dõi Calo Hằng Ngày</h1>

    <!-- Phần tính toán TDEE -->
    <section class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg mb-8 transform hover:scale-105 transition-transform duration-300">
      <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">Tính Toán TDEE</h2>
      <form id="tdeeForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 dark:text-gray-300">Giới tính</label>
          <select id="gender" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white">
            <option value="male">Nam</option>
            <option value="female">Nữ</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 dark:text-gray-300">Tuổi</label>
          <input id="age" type="number" placeholder="Nhập tuổi" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white" min="1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 dark:text-gray-300">Chiều cao (cm)</label>
          <input id="height" type="number" placeholder="Nhập chiều cao" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white" min="1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 dark:text-gray-300">Cân nặng (kg)</label>
          <input id="weight" type="number" placeholder="Nhập cân nặng" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white" min="1">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 dark:text-gray-300">Mức độ vận động</label>
          <select id="activity" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white">
            <option value="1.2">Ít vận động</option>
            <option value="1.375">Vận động nhẹ</option>
            <option value="1.55">Vận động vừa phải</option>
            <option value="1.725">Vận động nhiều</option>
            <option value="1.9">Vận động rất nhiều</option>
          </select>
        </div>
        <button type="button" id="calculateTDEEButton" class="md:col-span-2 bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition-colors">Tính TDEE</button>
      </form>
      <p id="tdeeResult" class="mt-6 text-lg font-medium text-gray-800 dark:text-gray-200"></p>
    </section>

    <!-- Phần theo dõi calo -->
    <section class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg mb-8 transform hover:scale-105 transition-transform duration-300">
      <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">Theo Dõi Calo Hằng Ngày</h2>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">Chọn món ăn</label>
        <div class="flex space-x-2">
          <select id="foodSelect" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white">
            <option value="">Chọn món ăn</option>
          </select>
          <button id="addFoodButton" class="bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition-colors">Thêm</button>
        </div>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-2">Nhập calo thủ công</label>
        <div class="flex space-x-2">
          <input id="manualCalories" type="number" placeholder="Nhập calo" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-400 dark:bg-gray-700 dark:text-white" min="1">
          <button id="addManualCaloriesButton" class="bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition-colors">Thêm</button>
        </div>
      </div>
      <button id="resetFoodLogButton" class="bg-red-600 text-white p-3 rounded-lg mb-4 hover:bg-red-700 transition-colors">Xóa lịch sử</button>
      <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-8">
        <div id="progressBar" class="bg-blue-600 h-8 rounded-full text-white text-center flex items-center justify-center" style="width: 0%"></div>
      </div>
      <p id="calorieStatus" class="mt-4 text-lg text-gray-800 dark:text-gray-200"></p>
      <ul id="foodList" class="mt-6 space-y-2"></ul>
    </section>

    <!-- Phần biểu đồ -->
    <section class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg mb-8 transform hover:scale-105 transition-transform duration-300">
      <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">Lịch Sử Calo</h2>
      <canvas id="calorieChart" class="w-full h-64"></canvas>
    </section>

    <!-- Phần gợi ý -->
    <section class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg transform hover:scale-105 transition-transform duration-300">
      <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">Gợi Ý Giảm Cân</h2>
      <p id="suggestion" class="mb-6 text-gray-600 dark:text-gray-300"></p>
      <h3 class="font-semibold text-gray-700 dark:text-gray-200">Món ăn ít calo, nhiều protein:</h3>
      <ul class="list-disc pl-6 text-gray-600 dark:text-gray-300">
        <li>Ức gà luộc (165 calo / 100g)</li>
        <li>Trứng luộc (78 calo / quả)</li>
        <li>Sữa chua không đường (100 calo / hũ)</li>
        <li>Cá hồi áp chảo (200 calo / 100g)</li>
      </ul>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="script.js"></script>
</body>
</html>
